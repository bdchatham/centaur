- id: "1"
  title: Serve GET /api/workflows/runs/{run_id}/retry-report with each attempt's failure message and a 404 for unknown runs
  description: >-
    Add the route and its `WorkflowsRead` entry in `route_access`, returning `{"ok": true, "attempts": [...]}` built from the same shared attempt-entry reader as `/attempts` so every entry, including its `error` (the failure message of a failed attempt, `null` otherwise), is exactly the attempts endpoint's entry, plus the standard 404 error body for an unknown run (CAP-1 to CAP-4); no field is added to the attempt history. Prove it with a new `centaur-api-server/tests/run_retry_report_http.rs` that only issues HTTP requests: DB-backed tests (skipped without a database URL) seed runs retried twice on all four queues, with rows inserted out of attempt order, two attempts failing with the same message and one with a different one, a run whose failure has no message, a cancelled and a running attempt, and distinctive input, result and failure-detail values, and assert the order, entries equal to the `/attempts` entries, `error` equal to the message or null, that the distinctive values never appear in the body, and 404 with `ok` false for an unknown run id (a JSON body the missing route cannot give).
  spec_checkpoint: true
