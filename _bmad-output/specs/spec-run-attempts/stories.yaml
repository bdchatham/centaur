- id: "1"
  title: Serve GET /api/workflows/runs/{run_id}/attempts from a shared public attempt reader, with each entry's failure message and a 404 for unknown runs
  description: >-
    Add a public reader on `WorkflowRuntime` that returns the run's task's attempt entries oldest first by `attempt` as a serializable type of exactly `attempt`, `started_at`, `ended_at`, `outcome`, `error` (not-found error for an unknown run, as `get_run`), read from the `absurd.r_<queue>` rows with `outcome` `succeeded` for a completed attempt, `failed` for a failed one and `running` for every other state, `ended_at` the row's `completed_at` or `failed_at`, and `error` the string `message` member of that row's `failure_reason` for a failed attempt, else null. Add the route returning `{"ok": true, "attempts": <reader entries unchanged>}`, its `WorkflowsRead` entry in `route_access`, and the standard 404 error body for an unknown run (CAP-1, CAP-2, CAP-4, CAP-5, CAP-6, CAP-7, and CAP-3 for completed, failed and running attempts). Prove it with a new `centaur-api-server/tests/run_attempts_http.rs`: DB-backed tests (skipped without a database URL) seed runs on all four queues, including a run retried twice whose rows are inserted out of attempt order, failed attempts with distinct messages, a failure payload with extra members and a failed attempt with no string `message`, plus distinctive input, result and failure values, and assert over HTTP the exact five keys per entry, the order, `succeeded`/`failed`/`running` with RFC 3339 or null timestamps, `error` the message only for failed attempts and null otherwise, that the distinctive values and extra failure members never appear in the body, and 404 with `ok` false for an unknown run id; and a new `centaur-api-server/tests/run_attempts_reader.rs` that builds a `WorkflowRuntime`, calls the public reader directly and asserts the same entries and the not-found error.
  spec_checkpoint: true
- id: "2"
  title: Report cancelled attempts and the end time of unfinished attempts
  description: >-
    Map a cancelled attempt to outcome `cancelled` with `ended_at` taken from the task's `cancelled_at` (the attempt row carries no timestamp), and keep `ended_at` null for pending, running and sleeping attempts, with `error` null for all of them (CAP-3, CAP-6). Prove it with a new `centaur-api-server/tests/run_attempts_cancelled_http.rs` that issues HTTP requests against seeded runs: a run cancelled after a started attempt, a run cancelled while queued for a retry after a failed attempt, a run cancelled before any start, and pending and sleeping attempts, asserting `outcome`, `ended_at`, `started_at` and a null `error` for every such entry (including when the attempt row holds a failure payload) and the failed attempt's `error` message in the retried-then-cancelled run.
  spec_checkpoint: true
