- id: "1"
  title: Serve GET /api/workflows/runs/{run_id}/attempts with the run's attempt history and a 404 for unknown runs
  description: >-
    Add the route and its `WorkflowsRead` entry in `route_access`, returning `{"ok": true, "attempts": [{attempt, started_at, ended_at, outcome}]}` from the `absurd.r_<queue>` rows of the run's task, oldest first by `attempt`, with `outcome` `succeeded` for a completed attempt, `failed` for a failed one and `running` for every other state, `ended_at` the row's `completed_at` or `failed_at`, no payloads or ids, and the standard 404 error body for an unknown run (CAP-1, CAP-2, CAP-4, CAP-5, and CAP-3 for completed, failed and running attempts). Prove it with a new `centaur-api-server/tests/run_attempts_http.rs` that only issues HTTP requests: DB-backed tests (skipped without a database URL) seed runs on all four queues, including a run retried twice whose rows are inserted out of attempt order and any attempt's run id queried, with distinctive input, result and failure values, and assert the exact four keys per entry, the order, `succeeded`/`failed`/`running` with RFC 3339 or null timestamps, that the distinctive values never appear in the body, and 404 with `ok` false for an unknown run id.
  spec_checkpoint: true
- id: "2"
  title: Report cancelled attempts and the end time of unfinished attempts
  description: >-
    Map a cancelled attempt to outcome `cancelled` with `ended_at` taken from the task's `cancelled_at` (the attempt row carries no timestamp), and keep `ended_at` null for pending, running and sleeping attempts (CAP-3). Prove it with a new `centaur-api-server/tests/run_attempts_cancelled_http.rs` that issues HTTP requests against seeded runs: a run cancelled after a started attempt, a run cancelled while queued for a retry after a failed attempt, a run cancelled before any start, and pending and sleeping attempts, asserting `outcome`, `ended_at` and `started_at` for every entry.
  spec_checkpoint: true
