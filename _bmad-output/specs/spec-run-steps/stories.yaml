- id: "1"
  title: Serve GET /api/workflows/runs/{run_id}/steps with the run's step history and a 404 for unknown runs
  description: >-
    Add the route and its `WorkflowsRead` entry in `route_access`, returning `{"ok": true, "steps": [{name, state, started_at, completed_at}]}` read from the committed checkpoint rows of the run's task (`absurd.c_<queue>`, attempts up to the run's own), oldest first by `completed_at` then `name`, with `started_at` null, no payload, an empty list for a run without steps and the standard 404 error body for an unknown run (CAP-1 to CAP-4). Prove it with a new `centaur-api-server/tests/run_steps_http.rs` that only issues HTTP requests: DB-backed tests (skipped without a database URL) seed runs on all four queues with checkpoint rows committed out of name order, a repeated `name#2` step, a distinctive payload and a checkpoint owned by a later attempt, and assert the exact four keys per entry, `state` `committed`, `started_at` null, RFC 3339 `completed_at`, the order, that the payload never appears in the body, that the later-attempt checkpoint is absent for the earlier run, an empty list for a run with no checkpoints, and 404 with `ok` false for an unknown run id.
  spec_checkpoint: true
