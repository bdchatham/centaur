- id: "1"
  title: Serve GET /api/workflows/runs/{run_id}/summary with last_error and a 404 for unknown runs
  description: >-
    Add the route and its `WorkflowsRead` entry in `route_access`, returning `{"ok": true, "summary": {run_id, workflow_name, status, attempts, created_at, updated_at, last_error}}` with the six shared values equal to the full run's for runs in any state on any of the four queues, `last_error` the failure message for failed runs and null for every other run, and the standard 404 error body for an unknown run (CAP-1 to CAP-4). Prove it with a new `centaur-api-server/tests/run_summary_http.rs` that only issues HTTP requests: DB-backed tests (skipped without a database URL) seed pending, running, completed, failed, cancelled and retried runs over all four queues, give the failed runs a known `{"name","message"}` failure payload and the non-failed runs a stored failure payload too, and assert the summary has exactly those seven keys, equals the same six fields of `GET /api/workflows/runs/{run_id}`, has `last_error` equal to the message for failed runs and null otherwise, and carries no `input`/`result`/`failure`, and that an unknown run id returns 404 with `ok` false.
  spec_checkpoint: true
