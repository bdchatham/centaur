- id: "1"
  title: Serve GET /api/workflows/runs/{run_id}/summary with a 404 for unknown runs
  description: >-
    Add the route and its `WorkflowsRead` entry in `route_access`, returning `{"ok": true, "summary": {run_id, workflow_name, status, attempts, created_at, updated_at}}` with values equal to the full run's for runs in any state on any of the four queues, and the standard 404 error body for an unknown run (CAP-1, CAP-2, CAP-3). Prove it with a new `centaur-api-server/tests/run_summary_http.rs` that only issues HTTP requests: DB-backed tests (skipped without a database URL) seed pending, running, completed, failed, cancelled and retried runs over all four queues and assert the summary has exactly those six keys, equals the same fields of `GET /api/workflows/runs/{run_id}`, and carries no `input`/`result`/`failure`, and that an unknown run id returns 404 with `ok` false.
  spec_checkpoint: true
