- id: "1"
  title: Expose started_at and completed_at on workflow runs from list_runs, get_run, and the HTTP routes
  description: >-
    Add nullable `started_at`/`completed_at` fields directly to `WorkflowRun` (updating its existing literal in `workflow_run_timestamps_serialize_as_rfc3339`, which the oracle flags for review) and populate them from the Absurd run and task timestamp columns for all four queues in `workflow_run_from_row` and the list and get queries (CAP-1, CAP-2, CAP-3). Prove it with new test files in `centaur-workflows/tests/` and `centaur-api-server/tests/` that serialize the existing `list_runs`/`get_run` output and call `GET /api/workflows/runs` and `/{run_id}`, asserting keys present, RFC 3339 or `null`, and equal values across list and get for pending, running, completed, failed, cancelled, and retried runs.
