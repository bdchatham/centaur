- id: "2"
  title: List workflow runs created after a time over GET /api/workflows/runs
  description: >-
    Make `GET /api/workflows/runs` accept `?created_after=<RFC 3339>`, validated before the runtime lookup (400 naming `created_after` and RFC 3339 for any invalid value) and applied in SQL per queue as a strict `created_at` bound before `limit`, combined with `limit`, `workflow_name` and `state` (CAP-1, CAP-2, CAP-3); helper types and the `list_runs_by_state` shape are the dev's choice. Prove it with a new `centaur-api-server/tests/runs_created_after_http.rs` that only issues HTTP requests: DB-free tests assert garbage, empty, date-only and offset-less values return 400, and DB-backed tests (skipped without a database URL) seed runs at known times over several queues and assert only strictly later runs return newest first, a run at exactly the bound and offset-equivalent bounds behave as instants, a bound later than every seeded run's `created_at` returns 200 with an empty runs list, the filter combines with `limit`, `workflow_name` and `state`, and omitting it is unchanged.
  spec_checkpoint: true
