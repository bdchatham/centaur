- id: "1"
  title: Return next_cursor on every run list response, from limit + 1 rows
  description: >-
    Make `list_runs_by_state` and `list_runs_for_queue` read `limit + 1` rows per queue and have `GET /api/workflows/runs` return `next_cursor` beside `runs`: `null` when no matching run lies past the page, otherwise a URL-safe opaque string encoding the last returned run's exact microsecond `created_at` and `task_id` (CAP-1, CAP-2). Prove it with a new `centaur-api-server/tests/runs_next_cursor_http.rs`, DB-backed (skipped without a database URL) and HTTP-only: a first page of runs over several queues returns the same ids as today in the same order with a string `next_cursor`, a final page and a page of exactly the remaining runs return `null`, a total that is an exact multiple of `limit` ends on `null`, an empty result returns `null`, and a filtered request (`workflow_name`, `state`) computes `next_cursor` from the matching runs only.
- id: "2"
  title: Resume the run list from a cursor with a keyset predicate
  description: >-
    Accept an optional `cursor` query parameter, decode it in the route before the runtime lookup, and apply it in each queue's SQL as a keyset predicate `(t.enqueue_at, t.task_id) < (cursor)` before `limit + 1`, so the next page is strictly after the named position in the merged order and combines with all filters (CAP-3, CAP-4). Prove it with a new `centaur-api-server/tests/runs_cursor_http.rs`, DB-backed and HTTP-only, following `next_cursor` with fixed filters and `limit`: a walk over more than 1000 runs returns each once in order and ends on `null`; runs sharing one `created_at` split across a page boundary, and in different queues, appear once each; runs inserted between two pages leave the later pages unchanged; `workflow_name`, `state`, `created_after` and `created_before` each hold across pages; microsecond-apart `created_at` values at a boundary are neither lost nor repeated.
- id: "3"
  title: Reject an undecodable cursor with a 400
  description: >-
    Make a `cursor` that cannot be decoded (garbage, empty, truncated, wrong shape, a non-UUID `task_id`, an out-of-range timestamp) return HTTP 400 naming `cursor`, in the style of `parse_created_bound`, decided before the workflow runtime lookup and never an empty page or a restart from the newest run (CAP-5). Prove it with a new `centaur-api-server/tests/runs_bad_cursor_http.rs` whose DB-free tests send each bad value to a router built without a workflow runtime and assert 400 with `ok` false and a message containing `cursor`, plus a DB-backed test that a valid `next_cursor` combined with an invalid `state` still reports the `state` error and that a bad cursor never returns a 200 page.
